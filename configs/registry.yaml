# Everything a study refers to by name: models, training data, evaluation suites, and the sha256
# of every file (checked again at run time by mopd.runtime.provenance). Paths are relative to
# paths.ROOT. Add a dataset here once; studies only name it. `python scripts/study.py pin` fills
# missing pins from the server. A dataset's train_settings (a built recipe's own sequence cap and
# micro-batching) apply to runs that train on it alone, unless the study sets them.
models:
  qwen3-4b-base:
    path: models/Qwen3-4B-Base
data:
  math-numina-v3:
    train: data/sft/numina_v3/train.jsonl
    holdout:
    - data/math/eval.jsonl
  instruction-smol:
    train: data/sft/smol_constraints/train.jsonl
    holdout:
    - data/sft/smol_constraints/dev.jsonl
  code-rstar-instr11:
    train: data/recipes/rstar-code-instr11/train.jsonl
    holdout:
    - data/recipes/rstar-code-instr11/dev.jsonl
  code-rstar-instr11-think:
    train: data/recipes/rstar-code-instr11-think/train.jsonl
    holdout:
    - data/recipes/rstar-code-instr11-think/dev.jsonl
    train_settings:
      sft_max_seq_len: 10240
      micro_batch_size: 4
      micro_batch_tokens: 16384
  code-oci-think-instr11:
    train: data/recipes/oci-think-instr11/train.jsonl
    holdout:
    - data/recipes/oci-think-instr11/dev.jsonl
    train_settings:
      sft_max_seq_len: 10240
      micro_batch_size: 4
      micro_batch_tokens: 16384
evals:
  unified-v3:
    data: data/full_eval/unified-v3/all.jsonl
    protocol_id: unified-v3-plainqa-greedy8192
    max_new_tokens: 8192
  lcbdev-v3:
    data: data/full_eval/lcb-dev-v3/lcbdev.jsonl
    protocol_id: lcbdev-v3-greedy8192
    max_new_tokens: 8192
  lcbdev-v3-think:
    data: data/full_eval/lcb-dev-v3/lcbdev.jsonl
    protocol_id: lcbdev-v3-think-greedy8192
    max_new_tokens: 8192
